    <script>
      // Prevent browser extension and third-party injected script errors (such as MetaMask, Canva, etc.) from disrupting the application or failing automated test flows
      window.addEventListener('error', function(event) {
        if (!event) return;
        const msg = (event.message || '').toLowerCase();
        const filename = (event.filename || '').toLowerCase();
        
        if (
          msg.includes('metamask') ||
          msg.includes('ethereum') ||
          msg.includes('wallet') ||
          msg.includes('script error') ||
          (msg === 'script error' && !filename) ||
          filename.includes('chrome-extension') ||
          filename.includes('extension') ||
          filename.includes('canva')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          const reason = event.reason;
          const message = typeof reason === 'string' ? reason : (reason.message || '');
          const msgLower = message.toLowerCase();
          if (
            msgLower.includes('metamask') || 
            msgLower.includes('ethereum') || 
            msgLower.includes('wallet') ||
            msgLower.includes('script error') ||
            msgLower.includes('canva')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }
      }, true);
    </script>
